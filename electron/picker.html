<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Compartilhar tela — Glitch</title>
    <style>
      :root {
        --bg: #111214;
        --card: #1e1f22;
        --hover: rgba(255, 255, 255, 0.06);
        --text: #dbdee1;
        --muted: #949ba4;
        --accent: #5865f2;
        --radius: 12px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 14px "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 18px 20px 10px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.2rem;
      }
      .tabs {
        display: inline-flex;
        gap: 4px;
        background: var(--card);
        padding: 4px;
        border-radius: 10px;
      }
      .tabs button {
        border: none;
        background: none;
        color: var(--muted);
        font: inherit;
        font-weight: 600;
        padding: 6px 16px;
        border-radius: 8px;
        cursor: pointer;
      }
      .tabs button.active {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 8px 20px 12px;
      }
      main::-webkit-scrollbar {
        width: 12px;
      }
      main::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        background-clip: padding-box;
        border: 3px solid transparent;
        border-radius: 999px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
      }
      .item {
        border: 2px solid transparent;
        background: var(--card);
        border-radius: var(--radius);
        padding: 8px;
        cursor: pointer;
        text-align: left;
        color: inherit;
        font: inherit;
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition: border-color 0.12s, background 0.12s;
      }
      .item:hover {
        background: #26272b;
      }
      .item.selected {
        border-color: var(--accent);
      }
      .thumb {
        aspect-ratio: 16 / 9;
        border-radius: 8px;
        background: #000 center / contain no-repeat;
      }
      .name {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .name img {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .name span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .empty {
        color: var(--muted);
        padding: 40px 0;
        text-align: center;
      }
      footer {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 20px;
        background: var(--card);
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        color: var(--muted);
      }
      input[type="checkbox"] {
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 6px;
        border: 2px solid var(--muted);
        display: grid;
        place-content: center;
        margin: 0;
        cursor: pointer;
      }
      input[type="checkbox"]:checked {
        background: var(--accent);
        border-color: var(--accent);
      }
      input[type="checkbox"]:checked::before {
        content: "";
        width: 10px;
        height: 6px;
        border-left: 2.5px solid #fff;
        border-bottom: 2.5px solid #fff;
        transform: translateY(-1px) rotate(-45deg);
      }
      .spacer {
        flex: 1;
      }
      .btn {
        border: none;
        border-radius: 8px;
        padding: 9px 18px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .btn.link {
        background: none;
        color: var(--text);
      }
      .btn.link:hover {
        text-decoration: underline;
      }
      .btn.primary {
        background: var(--accent);
        color: #fff;
      }
      .btn.primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Compartilhar tela</h1>
      <div class="tabs">
        <button data-tab="screen" class="active">Telas</button>
        <button data-tab="window">Janelas</button>
      </div>
    </header>
    <main><div class="grid" id="grid"></div></main>
    <footer>
      <label id="audioLabel" hidden><input type="checkbox" id="audio" /> Compartilhar áudio do sistema</label>
      <span class="spacer"></span>
      <button class="btn link" id="cancel">Cancelar</button>
      <button class="btn primary" id="share" disabled>Compartilhar</button>
    </footer>
    <script>
      const grid = document.getElementById("grid");
      const share = document.getElementById("share");
      const audio = document.getElementById("audio");
      let sources = [];
      let tab = "screen";
      let selected = null;

      function render() {
        grid.textContent = "";
        const list = sources.filter((s) => (tab === "screen" ? s.screen : !s.screen));
        if (!list.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = tab === "screen" ? "Nenhuma tela encontrada." : "Nenhuma janela aberta para compartilhar.";
          grid.appendChild(empty);
        }
        for (const s of list) {
          const b = document.createElement("button");
          b.className = "item" + (selected === s.id ? " selected" : "");
          const thumb = document.createElement("div");
          thumb.className = "thumb";
          if (s.thumb) thumb.style.backgroundImage = `url("${s.thumb}")`;
          const name = document.createElement("div");
          name.className = "name";
          if (s.icon) {
            const img = document.createElement("img");
            img.src = s.icon;
            name.appendChild(img);
          }
          const label = document.createElement("span");
          label.textContent = s.name;
          name.appendChild(label);
          b.append(thumb, name);
          b.onclick = () => {
            selected = s.id;
            share.disabled = false;
            render();
          };
          b.ondblclick = () => window.glitchPicker.choose(s.id, audio.checked);
          grid.appendChild(b);
        }
      }

      document.querySelectorAll(".tabs button").forEach((b) => {
        b.onclick = () => {
          tab = b.dataset.tab;
          document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("active", x === b));
          render();
        };
      });
      document.getElementById("cancel").onclick = () => window.glitchPicker.cancel();
      share.onclick = () => selected && window.glitchPicker.choose(selected, audio.checked);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") window.glitchPicker.cancel();
        if (e.key === "Enter" && selected) window.glitchPicker.choose(selected, audio.checked);
      });

      window.glitchPicker.get().then((data) => {
        sources = data.sources;
        if (data.canShareAudio) {
          document.getElementById("audioLabel").hidden = false;
          audio.checked = !!data.audioRequested;
        }
        // Seleciona a tela principal por padrão
        const first = sources.find((s) => s.screen);
        if (first) {
          selected = first.id;
          share.disabled = false;
        }
        render();
      });
    </script>
  </body>
</html>
