[package]
name = "glitch"
version = "0.1.0"
description = "Glitch — cliente Matrix com cara de Discord"
authors = ["Glitch"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "glitch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
livekit = { version = "0.10", features = ["rustls-tls-native-roots"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[profile.release]
# Executável menor
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
