name: Sincronizar fork com upstream

on:
  schedule:
    # Todos os dias às 09:00 UTC (06:00 no horário de Brasília)
    - cron: '0 9 * * *'
  # Permite rodar manualmente pela aba "Actions"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sincronizar com upstream
        run: |
          git remote add upstream https://github.com/Sassevern/Glitch.git
          git fetch upstream main

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Faz merge do upstream; falha (com aviso) se houver conflito
          if git merge upstream/main --no-edit; then
            git push origin main
          else
            echo "::error::Conflito ao fazer merge do upstream. Resolva manualmente."
            git merge --abort
            exit 1
          fi
